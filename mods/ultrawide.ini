# SF2Recomp - configuracion
# Edita este archivo con el juego cerrado.  Los valores no validos se ignoran con un aviso al arrancar.

[video]
# scale: 0 = ajustar a la pantalla, N = ventana de (384*N) x (224*N)
scale = 3
# aspect: pixel = pixeles cuadrados (384x224); 4:3 = proporcion de la pantalla de la recreativa
aspect = 4:3
fullscreen = false
# integer_scale: escalar solo por factores enteros (pixeles sin deformar)
integer_scale = true
# smooth: false = pixeles nitidos, true = filtro lineal
smooth = false
vsync = true
# widescreen: muestra mas escenario a los lados en los combates (las demas pantallas se centran con barras negras);
# la pantalla de la recreativa no se estira.  wide_width: ancho del cuadro, par, de 384 a 800; con aspect = 4:3
# 512 da una ventana 16:9.  Tecla: widescreen en [hotkeys]
widescreen = true
wide_width = 768
# hud: center = el marcador del combate donde lo compone el juego; edges = pegado a los bordes de la ventana ancha
hud = edges
# wide_logic: con widescreen, los luchadores se mueven por todo el ancho de la ventana ancha y la camara se queda dentro del arte.
# CAMBIA EL JUEGO (ya no es identico a la recreativa); false = juego original.  Tecla: wide_logic en [hotkeys]
wide_logic = false
# stage_full: con widescreen, camara fija en el centro y todo el escenario a la vista (768 de ancho = el recorrido completo, para
# monitores ultraanchos: 3440x1440 con aspect = 4:3 pide wide_width = 688; 768 deja franjas finas arriba y abajo).  CAMBIA EL JUEGO.
stage_full = true

[audio]
enabled = true
# volume: 0 a 100
volume = 80
# rate: frecuencia del dispositivo de audio; la mezcla es de 48000 Hz y SDL la convierte
rate = 48000

[dip]
# dipswitches de la placa (los valores de MAME entre parentesis)
# difficulty: 0 (mas facil) a 7 (mas dificil); 3 = normal
difficulty = 3
# coin_a, coin_b: monedas por credito: 4c1c 3c1c 2c1c 1c1c 1c2c 1c3c 1c4c 1c6c
coin_a = 1c1c
coin_b = 1c1c
free_play = false
two_coins_to_start = false
demo_sounds = true
allow_continue = true
freeze = false
# test_mode: arranca en el menu de pruebas de la placa
test_mode = false

[paths]
# rom: sf2.zip de MAME o carpeta con las ROMs sueltas (vacio = buscar sf2.zip junto al juego)
rom = 
# state_dir: carpeta de los estados guardados (vacio = la de preferencias)
state_dir = 

[keys]
# nombres de tecla de SDL (Up, Left Shift, Z, F5, Keypad 4...); varias separadas por comas
coin1 = 5
start1 = 1
coin2 = 6
start2 = 2
service = F2
p1_up = Up
p1_down = Down
p1_left = Left
p1_right = Right
p1_lp = Z
p1_mp = X
p1_hp = C
p1_lk = A
p1_mk = S
p1_hk = D
p2_up = I
p2_down = K
p2_left = J
p2_right = L
p2_lp = R
p2_mp = T
p2_hp = Y
p2_lk = F
p2_mk = G
p2_hk = H

[pad]
# botones del mando (nombres de SDL): a b x y back start leftshoulder rightshoulder leftstick rightstick
# dpup dpdown dpleft dpright lefttrigger righttrigger.  El mando 1 es el jugador 1 y el 2 el jugador 2;
# la cruceta y el stick izquierdo mueven siempre
coin1 = back
start1 = start
coin2 = back
start2 = start
service = 
p1_up = dpup
p1_down = dpdown
p1_left = dpleft
p1_right = dpright
p1_lp = x
p1_mp = y
p1_hp = rightshoulder
p1_lk = a
p1_mk = b
p1_hk = righttrigger
p2_up = dpup
p2_down = dpdown
p2_left = dpleft
p2_right = dpright
p2_lp = x
p2_mp = y
p2_hp = rightshoulder
p2_lk = a
p2_mk = b
p2_hk = righttrigger

[hotkeys]
# save_state/load_state: guardar y cargar la ranura actual; slot_prev/slot_next: cambiar de ranura (0-9)
save_state = F5
load_state = F7
slot_prev = F6
slot_next = F8
pause = P
fast_forward = Tab
fullscreen = F11
screenshot = F12
reset = F10
quit = Escape
widescreen = F9
wide_logic = F3
stage_full = F4
